<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotus Atelier — bloom mechanic prototype</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-main);
    background-image: var(--bg-gradient);
    font-family: var(--font-body);
    color: var(--text-body);
  }

  /* ---- scroll track / sticky stage ---- */
  .proto-track { height: 680vh; position: relative; }
  .proto-stage {
    position: sticky; top: 0; height: 100vh;
    display: grid; grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  .proto-head { padding: 2rem clamp(1rem, 4vw, 3rem) 0; }
  .proto-eyebrow {
    margin: 0; font-family: var(--font-mono); font-size: 0.68rem;
    letter-spacing: 0.22em; color: var(--rose-ink); text-transform: uppercase;
  }
  .proto-title {
    margin: 0.35rem 0 0; font-family: var(--font-display);
    font-size: clamp(1.5rem, 3.2vw, 2.2rem); color: var(--text-headline); font-weight: 700;
  }
  .proto-note { margin: 0.35rem 0 0; font-size: 0.8rem; color: var(--text-muted); max-width: 54ch; }

  /* ---- the pond ---- */
  .pond {
    position: relative;
    perspective: 1500px;
    perspective-origin: 50% 42%;
    display: grid; place-items: center;
  }
  .water {
    position: absolute; inset: auto 0 0 0; height: 58%;
    background:
      radial-gradient(ellipse 70% 60% at 50% 0%, rgba(251,113,133,0.16), transparent 70%),
      linear-gradient(180deg, rgba(252,232,239,0.8), rgba(255,250,247,0.2));
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 55%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, #000 55%, transparent 100%);
    pointer-events: none;
  }
  #ripples { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* camera rig: dolly + pan live here, rotation lives on .lotus-world */
  .lotus-rig {
    position: relative;
    width: min(70vmin, 560px); height: min(70vmin, 560px);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .lotus-world {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .petal {
    position: absolute; left: 50%; top: 50%;
    width: var(--w); height: var(--h);
    margin-left: calc(var(--w) / -2);
    margin-top: calc(var(--h) * -1);
    transform-origin: 50% 100%;
    transform-style: preserve-3d;
    transform: rotateZ(var(--a)) rotateX(var(--unfurl)) translateZ(var(--lift));
    will-change: transform;
    cursor: pointer;
  }
  .petal svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .petal-shape {
    filter: drop-shadow(0 6px 14px rgba(157, 23, 77, 0.10));
    transition: filter 220ms ease;
  }
  .petal.is-hot .petal-shape {
    filter: drop-shadow(0 0 16px rgba(251,113,133,0.6)) drop-shadow(0 6px 14px rgba(157,23,77,0.18));
  }

  /* Sticker adhered flat to petal surface: shares petal's 3D orientation, no floating billboard */
  .petal-badge {
    position: absolute; left: 50%; top: var(--badge-t, 26%);
    width: var(--badge-s, 36px); height: var(--badge-s, 36px);
    display: grid; place-items: center;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 1px 4px rgba(157, 23, 77, 0.12), inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    transform: translate(-50%, -50%) translateZ(1.5px);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
    transition: opacity 320ms ease, box-shadow 320ms ease;
  }
  /* Every mark stays legible and in full colour. The whorl currently opening
     is emphasised by a brighter halo, not by dimming everything else. */
  .petal:not(.is-live):not(.is-hot) .petal-badge { opacity: 0.88; }
  .petal.is-live .petal-badge {
    box-shadow: 0 1px 6px rgba(157, 23, 77, 0.20), 0 0 0 3px rgba(251, 113, 133, 0.40);
  }
  .petal-badge img { width: 62%; height: 62%; object-fit: contain; }
  .petal-badge .initials {
    font-family: var(--font-mono); font-size: 0.58rem; font-weight: 600; color: var(--text-body);
  }

  /* ---- seed pod (the archive) ---- */
  .pod {
    position: absolute; left: 50%; top: 50%;
    width: 138px; height: 138px; margin: -69px 0 0 -69px;
    border-radius: 50%;
    transform-style: preserve-3d;
    transform: translateZ(var(--pod-lift, 26px)) scale(var(--pod-scale, 1));
    background: radial-gradient(circle at 42% 36%, #FFF7EC 0%, #F6D9C4 48%, #DCA98C 100%);
    box-shadow: inset 0 -8px 18px rgba(157,23,77,0.18), 0 10px 26px rgba(157,23,77,0.16);
    border: none; padding: 0; cursor: pointer;
    will-change: transform;
  }
  .seed {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(157,23,77,0.6);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
    transform: translate(-50%, -50%);
  }
  .pod-label {
    position: absolute; left: 50%; top: 50%;
    transform:
      translate(-50%, -50%)
      rotateZ(var(--yaw-undo, 0deg))
      rotateX(var(--tilt-undo, -58deg))
      translateZ(40px);
    font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.12em;
    color: var(--rose-ink); background: rgba(255,255,255,0.92);
    padding: 0.28rem 0.6rem; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--rose-tag-border); pointer-events: none;
    opacity: 0; transition: opacity 200ms ease;
  }
  .pod:hover + .pod-label, .pod:focus-visible + .pod-label { opacity: 1; }

  /* ---- caption on the water ---- */
  .proto-foot {
    padding: 0 clamp(1rem, 4vw, 3rem) 2rem;
    display: flex; flex-wrap: wrap; gap: 1rem 2rem;
    align-items: flex-end; justify-content: space-between;
  }
  .whorl-caption { max-width: 52ch; }
  .whorl-caption .tag {
    display: inline-block; font-family: var(--font-mono); font-size: 0.62rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--rose-ink);
    background: var(--rose-tag-bg); border: 1px solid var(--rose-tag-border);
    padding: 0.2rem 0.55rem; border-radius: 999px;
  }
  .whorl-caption h3 {
    margin: 0.5rem 0 0.2rem; font-family: var(--font-display);
    font-size: 1.1rem; color: var(--text-headline); font-weight: 600;
  }
  .whorl-caption p { margin: 0; font-size: 0.84rem; color: var(--text-muted); }

  .stops { display: flex; gap: 0.4rem; }
  .stop {
    width: 34px; height: 5px; border-radius: 999px; border: none;
    background: rgba(157,23,77,0.16); cursor: pointer; padding: 0;
    transition: background 220ms ease, transform 220ms ease;
  }
  .stop.on { background: var(--rose-primary); transform: scaleY(1.6); }

  /* idle whisper on the water */
  .idle-hint {
    position: absolute; left: 50%; bottom: 10%;
    transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-subtle);
    opacity: 0; transition: opacity 700ms ease; pointer-events: none;
  }
  .idle-hint.on { opacity: 1; }

  /* ---- scrub panel (prototype only) ---- */
  .scrub {
    position: fixed; right: 1rem; top: 1rem; z-index: 20;
    background: rgba(255,255,255,0.93); border: 1px solid var(--border-glass);
    border-radius: 14px; padding: 0.7rem 0.9rem; box-shadow: var(--shadow-md);
    font-family: var(--font-mono); font-size: 0.64rem; color: var(--text-body);
    display: grid; gap: 0.4rem; width: 214px;
  }
  .scrub label { display: flex; justify-content: space-between; letter-spacing: 0.06em; }
  .scrub input[type=range] { width: 100%; accent-color: var(--rose-primary); }
  .scrub .row { display: flex; gap: 0.4rem; align-items: center; justify-content: space-between; }
  .scrub .hint { color: var(--text-subtle); line-height: 1.5; margin: 0; }
  .scrub .state { color: var(--rose-ink); }

  @media (prefers-reduced-motion: reduce) {
    .petal, .petal-badge { transition: none !important; }
  }
</style>
</head>
<body>

<div class="proto-track" id="track">
  <div class="proto-stage">

    <header class="proto-head">
      <p class="proto-eyebrow">Prototype · Lotus Atelier</p>
      <h1 class="proto-title">Six Whorls, Ninety-Two Seeds</h1>
      <p class="proto-note">Scroll to bloom — the camera rises and orbits as it opens. Stop scrolling and the flower breathes.</p>
    </header>

    <div class="pond" id="pond">
      <div class="water" aria-hidden="true"></div>
      <canvas id="ripples" aria-hidden="true"></canvas>
      <div class="lotus-rig" id="rig">
        <div class="lotus-world" id="world"></div>
      </div>
      <p class="idle-hint" id="idleHint">keep scrolling to open further</p>
    </div>

    <footer class="proto-foot">
      <div class="whorl-caption" id="caption">
        <span class="tag">Whorl 01</span>
        <h3>—</h3>
        <p>—</p>
      </div>
      <nav class="stops" id="stops" aria-label="Whorls"></nav>
    </footer>

  </div>
</div>

<div class="scrub">
  <label><span>BLOOM</span><span id="bloomOut">0.35</span></label>
  <input type="range" id="bloomRange" min="0" max="1" step="0.001" value="0.35">
  <label><span>CAMERA</span><span id="camOut">—</span></label>
  <div class="row">
    <span>ORBIT</span>
    <input type="range" id="orbitRange" min="0" max="60" step="1" value="28" style="width:110px">
  </div>
  <div class="row">
    <span>IDLE DRIFT</span>
    <input type="checkbox" id="idleToggle" checked>
  </div>
  <p class="hint">State: <span class="state" id="stateOut">idle</span>. Scrubbing overrides scroll until you scroll again.</p>
</div>

<script src="../js/tech-brands.js"></script>
<script>
(function () {
  'use strict';

  // Open order: outermost whorl blooms first (substrate -> refinement).
  var WHORLS = [
    { seq:'01', title:'Silicon, Sensors & Hardware', philosophy:'Connecting physical circuitry with embedded protocols.',
      staples:[['ESP32 (ESP-NOW)','espressif'],['Arduino','arduino'],['PlatformIO','platformio'],['INA219 Power Sensors',null],['RC522 RFID',null],['Unity 3D','unity']] },
    { seq:'02', title:'Craft Environment & Workflow', philosophy:'Frictionless developer ergonomics, containers, and deployment.',
      staples:[['Docker & Compose','docker'],['Git / GitHub','git'],['VS Code','visualstudiocode'],['Cloudflare Workers','cloudflareworkers'],['Vite','vite'],['GitHub Actions','githubactions']] },
    { seq:'03', title:'Resilient Backends & Data', philosophy:'High-throughput APIs, persistent storage, and real-time state.',
      staples:[['Node.js','nodedotjs'],['PostgreSQL','postgresql'],['Redis / Upstash','redis'],['FastAPI','fastapi'],['Supabase','supabase'],['Express.js','express']] },
    { seq:'04', title:'Languages of Thought', philosophy:'Expressive syntax, memory safety, and systems programming.',
      staples:[['TypeScript','typescript'],['C++','cplusplus'],['Python','python'],['Dart','dart'],['C#','csharp'],['JavaScript','javascript']] },
    { seq:'05', title:'Tactile Interfaces & Web', philosophy:'Soft, accessible, and reactive user experiences.',
      staples:[['React 19','react'],['Next.js (15/16)','nextdotjs'],['Tailwind CSS v4','tailwindcss'],['Three.js','threedotjs'],['GSAP','greensock'],['Radix UI','radixui']] },
    { seq:'06', title:'Intelligent Agents & Vision', philosophy:'Applied agent architectures and computer vision pipelines.',
      staples:[['Google Gemini','googlegemini'],['Claude Code CLI','claude'],['MCP Protocol','modelcontextprotocol'],['OpenCV','opencv'],['YOLOv8','ultralytics'],['Google Antigravity',null]] }
  ];

  var N = WHORLS.length;
  var brands = window.TECH_BRANDS || {};
  var rig = document.getElementById('rig');
  var world = document.getElementById('world');
  var stops = document.getElementById('stops');
  var cap = document.getElementById('caption');
  var track = document.getElementById('track');
  var pond = document.getElementById('pond');
  var idleHint = document.getElementById('idleHint');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PETAL_PATH = 'M50 6 C 14 62, 0 140, 18 202 C 27 241, 40 257, 50 262 C 60 257, 73 241, 82 202 C 100 140, 86 62, 50 6 Z';
  var MIDRIB_PATH = 'M50 22 C 43 92, 43 172, 50 248 C 57 172, 57 92, 50 22 Z';

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(t) { return t * t * (3 - 2 * t); }
  // gentle overshoot so a petal settles instead of stopping dead
  function easeOutBack(t) {
    var c1 = 0.9, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // ------------------------------------------------------------------
  // CAMERA RIG — keyframed against bloom, interpolated with smoothstep
  //   tilt: how far we look down into the flower
  //   yaw:  orbit around the vertical axis
  //   dist: dolly (scale)
  //   lift: vertical pan, as a share of the rig height
  // ------------------------------------------------------------------
  var CAM = [
    { at: 0.00, tilt: 26, yaw: -26, dist: 0.88, lift:  4 },
    { at: 0.18, tilt: 37, yaw: -14, dist: 0.95, lift:  1 },
    { at: 0.42, tilt: 50, yaw:  -2, dist: 1.02, lift: -2 },
    { at: 0.68, tilt: 60, yaw:  12, dist: 1.00, lift: -5 },
    { at: 0.88, tilt: 63, yaw:  22, dist: 0.94, lift: -5 },
    { at: 1.00, tilt: 58, yaw:  30, dist: 0.90, lift: -4 }
  ];

  function camAt(b) {
    var i = 0;
    while (i < CAM.length - 2 && b > CAM[i + 1].at) i++;
    var a = CAM[i], c = CAM[i + 1];
    var t = smoothstep(clamp((b - a.at) / (c.at - a.at), 0, 1));
    return {
      tilt: lerp(a.tilt, c.tilt, t),
      yaw:  lerp(a.yaw,  c.yaw,  t),
      dist: lerp(a.dist, c.dist, t),
      lift: lerp(a.lift, c.lift, t)
    };
  }

  // geometry per whorl (0 = outermost)
  function geom(i) {
    var t = i / (N - 1);
    return {
      w: lerp(104, 58, t),
      h: lerp(262, 132, t),
      open: lerp(-4, -54, t),   // outer lays flat, inner stays cupped
      closed: -86,
      lift: lerp(0, 30, t),
      badgeT: lerp(30, 17, t) + '%',
      badgeS: lerp(38, 27, t) + 'px',
      offset: (i % 2) * 30      // half-slot stagger for packing
    };
  }

  function brandOf(name, mark) {
    return brands[name] || (mark ? brands[mark] : null) || null;
  }
  function initials(name) {
    return name.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).slice(0, 2)
      .map(function (s) { return s[0]; }).join('').toUpperCase();
  }

  var petals = [];

  WHORLS.forEach(function (whorl, wi) {
    var g = geom(wi);
    whorl.staples.forEach(function (pair, pi) {
      var name = pair[0], mark = pair[1];
      var brand = brandOf(name, mark);
      var color = (brand && brand.color) || '#FB7185';
      var angle = g.offset + pi * (360 / whorl.staples.length);

      var petal = document.createElement('div');
      petal.className = 'petal';
      petal.title = name + ' — ' + whorl.title;
      petal.style.setProperty('--w', g.w + 'px');
      petal.style.setProperty('--h', g.h + 'px');
      petal.style.setProperty('--a', angle + 'deg');
      petal.style.setProperty('--lift', g.lift + 'px');
      petal.style.setProperty('--unfurl', g.closed + 'deg');
      petal.style.setProperty('--badge-t', g.badgeT);
      petal.style.setProperty('--badge-s', g.badgeS);

      var gid = 'pg-' + wi + '-' + pi;
      petal.innerHTML =
        '<svg viewBox="0 0 100 264" preserveAspectRatio="none" aria-hidden="true">' +
          '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="color-mix(in oklab, ' + color + ' 14%, #FFF6F8)"/>' +
            '<stop offset="58%" stop-color="color-mix(in oklab, ' + color + ' 32%, #FDE7EF)"/>' +
            '<stop offset="100%" stop-color="color-mix(in oklab, ' + color + ' 52%, #FB7185)"/>' +
          '</linearGradient></defs>' +
          '<path class="petal-shape" d="' + PETAL_PATH + '" fill="url(#' + gid + ')" ' +
            'stroke="color-mix(in oklab, ' + color + ' 38%, #FFFFFF)" stroke-width="1.2"/>' +
          '<path d="' + MIDRIB_PATH + '" fill="rgba(255,255,255,0.38)"/>' +
        '</svg>';

      var badge = document.createElement('span');
      badge.className = 'petal-badge';
      if (brand && brand.asset) {
        var img = document.createElement('img');
        img.src = '../' + brand.asset;
        img.alt = '';
        img.onerror = function () {
          badge.innerHTML = '<span class="initials">' + initials(name) + '</span>';
        };
        badge.appendChild(img);
      } else {
        badge.innerHTML = '<span class="initials">' + initials(name) + '</span>';
      }
      petal.appendChild(badge);

      petal.addEventListener('pointerenter', function () {
        petal.classList.add('is-hot');
        splash(petal);
      });
      petal.addEventListener('pointerleave', function () {
        petal.classList.remove('is-hot');
      });

      world.appendChild(petal);
      petals.push({
        el: petal,
        wi: wi,
        g: g,
        baseAngle: angle,
        delay: pi * 0.028,                    // petals in a whorl open in sequence
        phase: (wi * 1.7 + pi * 0.9) % 6.283  // per-petal idle flutter offset
      });
    });
  });

  // seed pod: 92 seeds in a phyllotaxis spiral
  var pod = document.createElement('button');
  pod.className = 'pod';
  pod.type = 'button';
  pod.setAttribute('aria-label', 'Open the full archive — 92 instruments');
  var GOLDEN = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < 92; i++) {
    var r = 52 * Math.sqrt((i + 0.5) / 92);
    var a = i * GOLDEN;
    var seed = document.createElement('span');
    seed.className = 'seed';
    seed.style.left = (69 + r * Math.cos(a)) + 'px';
    seed.style.top = (69 + r * Math.sin(a)) + 'px';
    seed.style.opacity = String(0.4 + 0.55 * (i / 92));
    pod.appendChild(seed);
  }
  pod.addEventListener('click', function () {
    pod.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(1.4)' }, { filter: 'brightness(1)' }], 420);
  });
  var podLabel = document.createElement('span');
  podLabel.className = 'pod-label';
  podLabel.textContent = '92 INSTRUMENTS · OPEN ARCHIVE';
  world.appendChild(pod);
  world.appendChild(podLabel);

  // stops
  WHORLS.forEach(function (w, i) {
    var b = document.createElement('button');
    b.className = 'stop';
    b.type = 'button';
    b.title = w.title;
    b.addEventListener('click', function () {
      window.scrollTo({ top: clamp(i * 0.13 + 0.2, 0, 1) * maxScroll(), behavior: 'smooth' });
    });
    stops.appendChild(b);
  });

  // ------------------------------------------------------------------
  // STATE
  // ------------------------------------------------------------------
  var urlParams = new URLSearchParams(window.location.search);
  var initialBloom = urlParams.has('bloom') ? clamp(parseFloat(urlParams.get('bloom')), 0, 1) : 0.35;
  var bloomTarget = initialBloom;   // where scroll (or the scrubber) wants us
  var bloom = initialBloom;         // where we actually are — eased, never snapped
  var idle = 0;             // 0 = actively scrolling, 1 = fully settled
  var lastInput = performance.now();
  var orbitAmount = 28;     // scales the yaw keyframes
  var idleEnabled = true;
  var pointerYaw = 0, pointerTilt = 0;   // mouse parallax targets
  var pYaw = 0, pTilt = 0;               // ...eased
  var activeWhorl = -1;

  var camOut = document.getElementById('camOut');
  var stateOut = document.getElementById('stateOut');
  var bloomOut = document.getElementById('bloomOut');
  var bloomRange = document.getElementById('bloomRange');
  if (bloomRange) bloomRange.value = String(initialBloom);
  if (bloomOut) bloomOut.textContent = initialBloom.toFixed(2);

  function maxScroll() {
    return Math.max(1, track.offsetHeight - window.innerHeight);
  }

  function whorlProgress(p, b) {
    return clamp((b - (p.wi * 0.13 + p.delay)) / 0.42, 0, 1);
  }

  window.addEventListener('scroll', function () {
    bloomTarget = clamp(window.scrollY / maxScroll(), 0, 1);
    bloomRange.value = String(bloomTarget);
    lastInput = performance.now();
  }, { passive: true });

  bloomRange.addEventListener('input', function (e) {
    bloomTarget = parseFloat(e.target.value);
    lastInput = performance.now();
  });
  document.getElementById('orbitRange').addEventListener('input', function (e) {
    orbitAmount = parseInt(e.target.value, 10);
  });
  document.getElementById('idleToggle').addEventListener('change', function (e) {
    idleEnabled = e.target.checked;
  });

  pond.addEventListener('pointermove', function (e) {
    var r = pond.getBoundingClientRect();
    pointerYaw = ((e.clientX - r.left) / r.width - 0.5) * 7;    // +/- 3.5deg
    pointerTilt = ((e.clientY - r.top) / r.height - 0.5) * -5;  // +/- 2.5deg
    lastInput = performance.now();
    if (Math.random() < 0.08) {
      rings.push({ x: e.clientX - r.left, y: e.clientY - r.top, r: 4, life: 1 });
      if (rings.length > 16) rings.shift();
    }
  });
  pond.addEventListener('pointerleave', function () {
    pointerYaw = 0; pointerTilt = 0;
  });

  // ------------------------------------------------------------------
  // RENDER LOOP — one rAF drives easing, camera, bloom and idle drift
  // ------------------------------------------------------------------
  var prevNow = performance.now();

  // Per-frame lerp factors are written for 60fps, then corrected for the real
  // frame time -- otherwise the whole piece runs at a different speed on a
  // 120Hz display than it does on a throttled tab.
  function damp(rate, dt) { return 1 - Math.pow(1 - rate, dt * 60); }

  function frame(now) {
    var t = now / 1000;
    var dt = Math.min((now - prevNow) / 1000, 0.1);   // clamp after a tab-switch stall
    prevNow = now;

    // scroll -> bloom is eased, so flicks and trackpad jitter never show
    bloom += (bloomTarget - bloom) * (reduced ? 1 : damp(0.085, dt));

    // idle ramps in over ~1.5s after the last input, and out fast when it resumes
    var wantIdle = (idleEnabled && !reduced && now - lastInput > 700) ? 1 : 0;
    idle += (wantIdle - idle) * damp(wantIdle ? 0.018 : 0.12, dt);

    // idle breathing nudges the bloom itself, so the petals keep living
    var b = clamp(bloom + Math.sin(t * 0.55) * 0.014 * idle, 0, 1);

    // ---- camera ----
    var cam = camAt(b);
    pYaw  += (pointerYaw  - pYaw)  * damp(0.05, dt);
    pTilt += (pointerTilt - pTilt) * damp(0.05, dt);

    var tilt = cam.tilt + Math.sin(t * 0.23 + 1.1) * 1.4 * idle + pTilt;
    var yaw  = cam.yaw * (orbitAmount / 28) + Math.sin(t * 0.31) * 3.4 * idle + pYaw;
    var dist = cam.dist * (1 + 0.006 * Math.sin(t * 0.27) * idle);
    var lift = cam.lift + Math.sin(t * 0.19 + 2.2) * 0.9 * idle;

    rig.style.transform = 'translateY(' + lift.toFixed(2) + '%) scale(' + dist.toFixed(4) + ')';
    world.style.transform = 'rotateX(' + tilt.toFixed(2) + 'deg) rotateZ(' + yaw.toFixed(2) + 'deg)';
    world.style.setProperty('--tilt-undo', (-tilt).toFixed(2) + 'deg');
    world.style.setProperty('--yaw-undo', (-yaw).toFixed(2) + 'deg');

    // ---- petals ----
    var active = 0;
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      var raw = whorlProgress(p, b);
      var prog = easeOutBack(raw);

      // idle flutter: a petal that has opened sways a little on its own
      var flut = Math.sin(t * 0.85 + p.phase) * 1.7 * idle * raw;
      var twist = Math.sin(t * 0.61 + p.phase * 1.3) * 1.2 * idle * raw;

      p.el.style.setProperty('--unfurl', (lerp(p.g.closed, p.g.open, prog) + flut).toFixed(2) + 'deg');
      p.el.style.setProperty('--a', (p.baseAngle + twist).toFixed(2) + 'deg');
      p.el.style.opacity = clamp(0.74 + raw * 0.4, 0, 1).toFixed(3);
      if (raw > 0.25) active = p.wi;
    }

    if (active !== activeWhorl) {
      activeWhorl = active;
      for (var j = 0; j < petals.length; j++) {
        petals[j].el.classList.toggle('is-live', petals[j].wi === active);
      }
      var w = WHORLS[active];
      cap.querySelector('.tag').textContent = 'Whorl ' + w.seq;
      cap.querySelector('h3').textContent = w.title;
      cap.querySelector('p').textContent = w.philosophy;
      Array.prototype.forEach.call(stops.children, function (btn, k) {
        btn.classList.toggle('on', k === active);
      });
    }

    var lastProg = whorlProgress(petals[petals.length - 1], b);
    var podReveal = clamp((b - 0.30) / 0.34, 0, 1);
    pod.style.setProperty('--pod-lift', (18 + 48 * lastProg).toFixed(1) + 'px');
    pod.style.setProperty('--pod-scale',
      ((0.45 + 0.55 * podReveal) * (1 + 0.035 * Math.sin(t * 1.1) * idle)).toFixed(4));
    pod.style.opacity = podReveal.toFixed(3);
    pod.style.pointerEvents = podReveal > 0.5 ? 'auto' : 'none';

    // idle whisper, only mid-bloom where there's still something to open
    idleHint.classList.toggle('on', idle > 0.6 && b > 0.08 && b < 0.92);

    bloomOut.textContent = b.toFixed(2);
    camOut.textContent = Math.round(tilt) + '° / ' + Math.round(yaw) + '°';
    stateOut.textContent = idle > 0.5 ? 'idle drift' : 'scrolling';

    drawRipples(t);
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------
  // WATER
  // ------------------------------------------------------------------
  var canvas = document.getElementById('ripples');
  var ctx = canvas.getContext('2d');
  var rings = [];
  var nextAmbient = 0;

  function fitCanvas() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, r.width * dpr);
    canvas.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function splash(el) {
    var pr = pond.getBoundingClientRect();
    var br = el.getBoundingClientRect();
    rings.push({ x: br.left + br.width / 2 - pr.left, y: br.top + br.height / 2 - pr.top, r: 6, life: 1 });
    if (rings.length > 16) rings.shift();
  }
  function drawRipples(t) {
    // while idle, the pond rings on its own every few seconds
    if (idle > 0.5 && t > nextAmbient) {
      var pr = pond.getBoundingClientRect();
      rings.push({
        x: pr.width * (0.3 + Math.random() * 0.4),
        y: pr.height * (0.55 + Math.random() * 0.3),
        r: 3, life: 1
      });
      nextAmbient = t + 2.2 + Math.random() * 2.4;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    rings = rings.filter(function (r) { return r.life > 0; });
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      r.r += 1.7;
      r.life -= 0.012;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.34, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(251,113,133,' + (r.life * 0.32).toFixed(3) + ')';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  window.addEventListener('resize', fitCanvas);
  fitCanvas();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
