<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project hero frames</title>
<!--
  PROJECT HERO FRAMES — source for assets/projects/<id>.png

  Each project gets a "page one": the hero a landing page for that product
  would open with, under a slim browser chrome so the frame reads as a page
  and not as a graphic. render.mjs screenshots this file once per project and
  writes the PNG the showcase card shows in its artwork band.

  DESIGN SYSTEM (ui-ux-pro-max, "portfolio project showcase, light, minimal")
    Style      Exaggerated Minimalism — oversized type, heavy negative space,
               a single accent per frame, no decoration. Scores WCAG AA and
               survives being read at thumbnail size, which is the whole
               problem here.
    Type       Space Grotesk / Plus Jakarta Sans / JetBrains Mono — the
               portfolio's own stack, so the art and the site agree.
    Light mode Canvas is the site's --bg-main #FFFAF7 under a tint of the
               project's accent. Ink is --text-headline #1E1520 (16:1),
               body --text-body #4A3E4E (9:1), meta --text-muted #7A697E
               (4.9:1). Every per-project accent is picked at a 700-ish tone
               so it clears 4.5:1 on the canvas as text, with separate soft
               fills for surfaces. Borders are solid warm greys, never
               white-on-white; surfaces are opaque, not 10% glass.
    Layout     Centred. It matches the card panel beneath, and it means the
               horizontal crop the band takes on narrow screens eats margin
               rather than content.
    Icons      Inline SVG (Lucide geometry). No emoji or dingbats as icons.

  The interaction half of the checklist — cursor, hover, focus, touch targets,
  reduced motion — has nothing to bite on: this file is rendered to a flat PNG
  and never shipped as a page. Contrast, type scale and layout are the parts
  that carry over, and those are held above.

  GEOMETRY. The frame is 480x196 because that is exactly the card's artwork
  band — .project-card is 480 CSS px wide and .project-card-media is 196 tall.
  Captured at device-scale 2 it lands at 960x392, so every size below is the
  size a visitor actually sees; nothing is a shrunken 1440px page. The product
  window is cut off by the bottom edge on purpose: a page one shows the top of
  its app, not all of it.
-->
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 480px; height: 196px; overflow: hidden; background: #FFFAF7; }

:root {
  --ink: #1E1520;        /* --text-headline  16:1 on canvas */
  --ink-body: #4A3E4E;   /* --text-body       9:1 */
  --ink-muted: #7A697E;  /* --text-muted    4.9:1 — the lightest tone used */
  --line: #EBDDE4;
  --line-soft: #F3E8ED;
}

.page {
  position: relative; width: 480px; height: 196px; overflow: hidden;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  color: var(--ink); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(96% 130% at 50% -26%, var(--wash) 0%, transparent 62%),
    radial-gradient(70% 90% at 96% 0%, var(--wash-2) 0%, transparent 66%),
    linear-gradient(176deg, #FFFCFA 0%, var(--canvas-end) 100%);
}

/* Faint rule grid. Negative space is the point of this style, so the grid
   only whispers — it gives the canvas a plane without adding an element. */
.page::before {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background-image:
    linear-gradient(rgba(30,21,32,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,21,32,.03) 1px, transparent 1px);
  background-size: 26px 26px;
  mask-image: radial-gradient(90% 120% at 50% 0%, #000 0%, transparent 76%);
}

/* ---- Browser chrome ------------------------------------------------------ */
/* Twenty pixels of frame is all it takes to say "this is a page". */
.chrome {
  position: relative; z-index: 3; display: flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 9px; border-bottom: 1px solid var(--line-soft);
  background: rgba(255,255,255,.66);
}
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: #E2D3DB; }
.url {
  margin: 0 auto; padding: 2px 12px; border-radius: 999px;
  background: #FFFFFF; border: 1px solid var(--line-soft);
  font-family: 'JetBrains Mono', monospace; font-size: 6.5px; color: var(--ink-muted);
}

/* ---- Hero copy ----------------------------------------------------------- */
.hero { position: relative; z-index: 3; padding: 10px 40px 0; text-align: center; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
  font-family: 'JetBrains Mono', monospace; font-size: 7px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
}
.eyebrow::before, .eyebrow::after { content: ''; width: 11px; height: 1px; background: var(--accent); opacity: .7; }
h1 {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px;
  line-height: 1.06; letter-spacing: -.03em; margin: 5px 0 0; color: var(--ink);
}
h1 em { font-style: normal; color: var(--accent); }
.sub { margin: 5px auto 0; max-width: 300px; font-size: 9px; line-height: 1.5; color: var(--ink-body); }
.actions { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
.btn-primary {
  font-size: 8px; font-weight: 700; padding: 6px 12px; border-radius: 7px;
  background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 11px -3px var(--accent-shadow);
}
.btn-ghost { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; color: var(--ink-body); }
.btn-ghost svg { width: 9px; height: 9px; stroke: var(--accent); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---- Product window ------------------------------------------------------ */
/* Rises from the bottom edge and is cropped by it. Only the title bar and the
   first rows of the scene survive, which is the part that identifies the
   project anyway. The negative offset is what does the cropping: it leaves
   ~68px of window on the frame, which is also what keeps the hero's CTA row
   clear of the window's title bar. */
.scene { position: absolute; z-index: 2; left: 50%; bottom: -46px; width: 344px; transform: translateX(-50%); }
.win {
  width: 344px; border-radius: 10px 10px 0 0; overflow: hidden; background: #FFFFFF;
  border: 1px solid var(--line); border-bottom: 0;
  box-shadow: 0 -2px 26px -8px rgba(30,21,32,.20);
}
.win-bar {
  display: flex; align-items: center; gap: 4px; padding: 6px 9px;
  background: var(--tint); border-bottom: 1px solid var(--line-soft);
}
.win-title { margin-left: 5px; font-family: 'JetBrains Mono', monospace; font-size: 6.5px; color: var(--ink-muted); }
.win-live {
  margin-left: 6px; display: inline-flex; align-items: center; gap: 3px; color: var(--accent);
  font-family: 'JetBrains Mono', monospace; font-size: 6px; font-weight: 700; letter-spacing: .1em;
}
.win-live::before { content: ''; width: 3.5px; height: 3.5px; border-radius: 50%; background: var(--accent); }
.win-body { padding: 9px 10px; height: 92px; }

/* Placeholder copy lines. Real sentences at 6px are noise; bars read as text
   at a glance and invent nothing. */
.bar { height: 3px; border-radius: 2px; background: #E6D9E0; }

/* ---- veralove: verified chat --------------------------------------------- */
.vl { display: flex; gap: 10px; }
.vl-rail { display: flex; flex-direction: column; gap: 7px; width: 62px; flex: none; }
.vl-row { display: flex; align-items: center; gap: 5px; }
.vl-av { width: 14px; height: 14px; border-radius: 50%; background: #F0E4EB; flex: none; }
.vl-row.is-on .vl-av { background: linear-gradient(145deg, var(--accent), var(--accent-2)); }
.vl-row .bar { width: 34px; }
.vl-thread { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.vl-chip {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 3px;
  font-size: 6.5px; font-weight: 700; padding: 3px 7px 3px 5px; border-radius: 999px;
  color: var(--accent); background: var(--soft); border: 1px solid var(--accent-line);
}
.vl-chip svg { width: 7px; height: 7px; stroke: var(--accent); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
/* Fixed width, not max-width: the outgoing bubble is align-self: flex-end, so
   a shrink-to-fit box would resolve the percentage bars inside it to zero. */
.vl-b { display: flex; flex-direction: column; gap: 3px; width: 128px; padding: 6px 8px; border-radius: 9px; }
.vl-b.in { background: #F6EEF2; border-bottom-left-radius: 3px; }
.vl-b.out { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 3px; }
.vl-b.out .bar { background: rgba(255,255,255,.62); }
.vl-b .bar:nth-child(1) { width: 88%; }
.vl-b .bar:nth-child(2) { width: 62%; }

/* ---- wildcat-one: week schedule ------------------------------------------ */
.wc-days { display: grid; grid-template-columns: repeat(5,1fr); gap: 5px; margin-bottom: 5px; }
.wc-days span { font-family: 'JetBrains Mono', monospace; font-size: 6.5px; color: var(--ink-muted); text-align: center; }
.wc-grid { display: grid; grid-template-columns: repeat(5,1fr); grid-auto-rows: 13px; gap: 5px; }
.wc-cell { border-radius: 3px; background: #F6EFE6; }
.wc-blk { border-radius: 3px; background: var(--soft); border-left: 2px solid var(--accent); }
.wc-blk.is-solid { background: var(--accent); border-left-color: var(--accent); }

/* ---- wall-crack-detector: inspection feed -------------------------------- */
.wcd { display: flex; gap: 8px; }
.wcd-view {
  position: relative; flex: 1; height: 74px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-soft);
  background:
    repeating-linear-gradient(94deg, rgba(30,21,32,.028) 0 3px, transparent 3px 9px),
    linear-gradient(158deg, #EFE9E3 0%, #D9D1C9 100%);
}
.wcd-view svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wcd-tag {
  position: absolute; left: 50%; top: 8px; padding: 2px 5px; border-radius: 3px;
  background: var(--accent); color: #FFFFFF;
  font-family: 'JetBrains Mono', monospace; font-size: 6px; font-weight: 700;
}
.wcd-stats { display: flex; flex-direction: column; gap: 5px; width: 74px; flex: none; }
.wcd-stat { padding: 4px 7px; border-radius: 6px; background: var(--tint); border: 1px solid var(--line-soft); }
.wcd-stat b { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--accent); }
.wcd-stat span { font-size: 5.5px; color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; }

/* ---- human-detector-2: tracked people ------------------------------------ */
.hd-view {
  position: relative; height: 74px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-soft);
  background: linear-gradient(170deg, #EDF3F5 0%, #DCE6EA 100%);
}
.hd-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(to top, rgba(14,116,144,.10), transparent); }
.hd-box { position: absolute; border: 1.3px solid var(--accent); border-radius: 3px; }
.hd-box::after {
  content: attr(data-id); position: absolute; top: -8px; left: -1.3px; padding: 0 4px; border-radius: 3px 3px 0 0;
  background: var(--accent); color: #FFFFFF;
  font-family: 'JetBrains Mono', monospace; font-size: 5.5px; font-weight: 700; line-height: 8px;
}
.hd-ghost { position: absolute; border-radius: 5px 5px 2px 2px; background: rgba(30,21,32,.17); }

/* ---- smartplug-system: outlet dashboard ---------------------------------- */
.sp { display: flex; gap: 8px; }
.sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 176px; flex: none; }
.sp-tile { padding: 5px 7px; border-radius: 7px; background: #FAF7F8; border: 1px solid var(--line-soft); }
.sp-tile.is-on { background: var(--soft); border-color: var(--accent-line); }
.sp-tile b { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: -.02em; color: var(--ink-muted); }
.sp-tile.is-on b { color: var(--accent); }
.sp-tile span { font-size: 5.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.sp-side { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.sp-chart { flex: 1; border-radius: 7px; background: var(--tint); border: 1px solid var(--line-soft); padding: 4px; }
.sp-chart svg { width: 100%; height: 100%; }
.sp-badge {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 6px; border-radius: 999px;
  background: var(--soft); border: 1px solid var(--accent-line); color: var(--accent);
  font-family: 'JetBrains Mono', monospace; font-size: 5.5px; font-weight: 600;
}
.sp-badge svg { width: 7px; height: 7px; stroke: var(--accent); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---- studyhub: live seat map --------------------------------------------- */
.sh { display: flex; gap: 9px; align-items: flex-start; }
.sh-map { flex: 1; display: grid; grid-template-columns: repeat(12,1fr); gap: 3px; }
.sh-seat { aspect-ratio: 1; border-radius: 2px; background: #F4EEF3; }
.sh-seat.is-taken { background: #DCD2DC; }
.sh-seat.is-free { background: var(--soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.sh-seat.is-pick { background: var(--accent); box-shadow: 0 0 0 1.6px #FFFFFF, 0 0 0 2.8px var(--accent-line); }
.sh-chip {
  width: 84px; flex: none; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px;
  border-radius: 7px; background: var(--accent); color: #FFFFFF;
}
.sh-chip b { font-size: 7.5px; font-weight: 700; }
.sh-chip span { font-family: 'JetBrains Mono', monospace; font-size: 6px; opacity: .8; }

/* ---- banter: terminal ----------------------------------------------------- */
.bt { font-family: 'JetBrains Mono', monospace; font-size: 6.5px; line-height: 1.95; display: flex; gap: 10px; }
.bt-rail { width: 62px; flex: none; border-right: 1px solid var(--line-soft); }
.bt-rail p { color: var(--ink-muted); }
.bt-rail p.is-on { color: var(--accent); font-weight: 700; }
.bt-log { flex: 1; }
.bt-log p { color: var(--ink-body); white-space: nowrap; }
.bt-log p i { font-style: normal; color: var(--accent); font-weight: 600; }
.bt-caret { display: inline-block; width: 4px; height: 7px; background: var(--accent); vertical-align: -1px; }
</style>
</head>
<body>
<script>
/* Lucide geometry, inlined. The checklist rules out emoji and dingbats as
   icons, and an <svg> also stays crisp at device-scale 2. */
const ICON = {
  arrowRight: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  radio: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>'
};

/* Scene builders. Each returns the inside of the product window for one
   project — the thing that makes the card recognisable at a glance. Only the
   first ~46px survives the crop, so the identifying element goes first. */
const SCENES = {

  // Verified profiles, then a thread.
  chat: () => `
    <div class="win-body vl">
      <div class="vl-rail">
        ${['is-on', '', ''].map(c => `<div class="vl-row ${c}"><span class="vl-av"></span><span class="bar"></span></div>`).join('')}
      </div>
      <div class="vl-thread">
        <span class="vl-chip">${ICON.check} Verified &middot; ID matched</span>
        <div class="vl-b in"><span class="bar"></span><span class="bar"></span></div>
        <div class="vl-b out"><span class="bar"></span><span class="bar"></span></div>
      </div>
    </div>`,

  // A week grid with classes dropped into it.
  schedule: () => {
    // Column, start row, span, solid — hand-placed so the blocks cluster like
    // a real timetable instead of scattering.
    const blocks = [[0,0,2,1],[1,1,2,0],[2,0,3,0],[3,1,2,1],[4,0,2,0],[1,3,2,1],[3,3,2,0]];
    const covered = (c, r) => blocks.some(b => b[0] === c && r > b[1] && r < b[1] + b[2]);
    const cells = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const b = blocks.find(b => b[0] === c && b[1] === r);
        if (b) cells.push(`<div class="wc-blk${b[3] ? ' is-solid' : ''}" style="grid-column:${c + 1};grid-row:${r + 1}/span ${b[2]}"></div>`);
        else if (!covered(c, r)) cells.push(`<div class="wc-cell" style="grid-column:${c + 1};grid-row:${r + 1}"></div>`);
      }
    }
    return `
    <div class="win-body">
      <div class="wc-days">${['M', 'T', 'W', 'TH', 'F'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="wc-grid">${cells.join('')}</div>
    </div>`;
  },

  // Segmented crack over concrete, with the severity read-out alongside.
  crack: () => {
    const seam = 'M12 4 C 38 22, 30 34, 58 48 C 84 60, 78 66, 104 74';
    return `
    <div class="win-body wcd">
      <div class="wcd-view">
        <svg viewBox="0 0 232 74" preserveAspectRatio="none">
          <path d="${seam}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" opacity=".22"/>
          <path d="${seam}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M58 48 C 74 50, 84 42, 98 38" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".75"/>
        </svg>
        <span class="wcd-tag">crack &middot; 0.94</span>
      </div>
      <div class="wcd-stats">
        <div class="wcd-stat"><b>1.8</b><span>mm max</span></div>
        <div class="wcd-stat"><b>27</b><span>fps</span></div>
      </div>
    </div>`;
  },

  // Boxes holding their IDs across the frame.
  tracking: () => `
    <div class="win-body">
      <div class="hd-view">
        <div class="hd-floor"></div>
        <div class="hd-ghost" style="left:54px;top:26px;width:18px;height:44px"></div>
        <div class="hd-ghost" style="left:148px;top:18px;width:22px;height:54px"></div>
        <div class="hd-ghost" style="left:242px;top:30px;width:16px;height:40px"></div>
        <div class="hd-box" data-id="ID 01" style="left:48px;top:22px;width:30px;height:50px"></div>
        <div class="hd-box" data-id="ID 02" style="left:142px;top:14px;width:34px;height:58px"></div>
        <div class="hd-box" data-id="ID 07" style="left:236px;top:26px;width:28px;height:46px"></div>
      </div>
    </div>`,

  // Outlets, their draw, and the badge that unlocked them.
  outlets: () => {
    const pts = '0,28 14,24 28,26 42,15 56,19 70,8 84,13 98,5 112,11 126,4 134,9';
    return `
    <div class="win-body sp">
      <div class="sp-grid">
        <div class="sp-tile is-on"><b>182 W</b><span>Outlet A &middot; on</span></div>
        <div class="sp-tile is-on"><b>76 W</b><span>Outlet B &middot; on</span></div>
        <div class="sp-tile"><b>0 W</b><span>Outlet C &middot; off</span></div>
        <div class="sp-tile"><b>0 W</b><span>Outlet D &middot; off</span></div>
      </div>
      <div class="sp-side">
        <div class="sp-chart">
          <svg viewBox="0 0 134 32" preserveAspectRatio="none">
            <polygon points="${pts} 134,32 0,32" fill="var(--accent)" opacity=".12"/>
            <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="sp-badge">${ICON.radio} 04 A2 9C 1B</span>
      </div>
    </div>`;
  },

  // The seat map, mid-reservation.
  seatmap: () => {
    const taken = new Set([0,1,3,7,10,13,15,16,21,24,25,27,31,34,36,39,40,43,46,48,51,54,57]);
    const free = new Set([4,5,8,18,19,28,29,33,44,45,49,55,58]);
    const pick = 20;
    const seats = Array.from({ length: 60 }, (_, i) => {
      const state = i === pick ? 'is-pick' : taken.has(i) ? 'is-taken' : free.has(i) ? 'is-free' : '';
      return `<i class="sh-seat ${state}"></i>`;
    }).join('');
    return `
    <div class="win-body sh">
      <div class="sh-map">${seats}</div>
      <div class="sh-chip"><b>Seat B4</b><span>holds 15:00</span></div>
    </div>`;
  },

  // Channels on the left, the room streaming on the right.
  terminal: () => `
    <div class="win-body bt">
      <div class="bt-rail">
        <p class="is-on">general</p>
        <p>builds</p>
        <p>cpe-2-1</p>
      </div>
      <div class="bt-log">
        <p><i>&raquo; dreeyanzz</i> pushed a fix</p>
        <p><i>&raquo; user_02</i> ship it then</p>
        <p>&raquo; <span class="bt-caret"></span></p>
      </div>
    </div>`
};

/* Per-project page one.

   The headline is deliberately NOT the card's tagline — the card prints that
   in the panel directly below, and the same sentence twice on one card reads
   as a mistake. Lines are kept short so 22px Space Grotesk never wraps past
   the two the <br> asks for.

   One accent per frame, at a tone that clears 4.5:1 on the canvas as text;
   --soft and --tint are its surface fills, --wash its atmosphere. */
const PROJECTS = {
  veralove: {
    url: 'veralove.app', eyebrow: 'Desktop ecosystem',
    h1: 'Meet people, not <em>scripts</em>.',
    sub: 'Every profile clears verification before it can say hello.',
    cta: 'Get verified', ghost: 'How it works',
    win: 'VeraLove &mdash; Messages', live: false, scene: 'chat',
    vars: {
      '--accent': '#E11D48', '--accent-2': '#F43F5E', '--accent-line': 'rgba(225,29,72,.26)',
      '--accent-shadow': 'rgba(225,29,72,.34)', '--soft': '#FFE7EC', '--tint': '#FFF5F7',
      '--wash': 'rgba(251,113,133,.22)', '--wash-2': 'rgba(244,114,182,.12)', '--canvas-end': '#FDF1F4'
    }
  },

  'wildcat-one': {
    url: 'wildcat.one', eyebrow: 'Student suite',
    h1: 'The whole campus, one <em>tab</em>.',
    sub: 'Schedules cached offline, catalog searchable, endpoints audited.',
    cta: 'Open portal', ghost: 'Browse catalog',
